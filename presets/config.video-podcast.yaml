layout:
  direction: row
  children:
    - panel: podcasts
      flex: 1
      source: podcast
      limit: 15

    - panel: youtube
      flex: 1
      source: youtube
      limit: 15

    - direction: column
      flex: 1
      children:
        - panel: media-feed
          flex: 3
          source: mastodon
          limit: 15

        - panel: podcast-tools
          flex: 1
          source: podcast-tools
          limit: 5

        - text: |
            **Feeds:** Changelog, Latent Space, Lex Fridman.
            **Channels:** Fireship, Computerphile, 3Blue1Brown,
            Veritasium. Fosstodon media posts round out the
            video column. Podcasts dedupe guest cross-appearances;
            YouTube dedupes topic overlap across channels.
          format: markdown
          title: Listening Notes
