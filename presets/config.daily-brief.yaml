layout:
  direction: column
  children:
    - panel: briefing-digest
      flex: 1
      source: briefing-digest
      limit: 20

    - direction: row
      flex: 3
      children:
        - direction: column
          flex: 2
          children:
            - panel: headlines
              flex: 2
              source: headlines
              limit: 20

            - panel: tech-pulse
              flex: 1
              source: hackernews
              limit: 12

        - direction: column
          flex: 1
          children:
            - panel: in-the-news
              flex: 1
              source: wiki-news
              limit: 10

            - panel: most-read
              flex: 1
              source: wiki-popular
              limit: 12

        - direction: column
          flex: 1
          children:
            - panel: today-in-history
              flex: 2
              source: wiki-today
              limit: 10

            - panel: my-tools
              flex: 1
              source: my-tools
              limit: 5

            - text: |
                **Sources:** BBC World, Ars Technica, Hacker News,
                Wikipedia (news, most-read, featured, on this day).
                Feeds refresh every 15-120 min depending on source.
              format: markdown
              title: About This Briefing
