# Pipelines: cross-adapter transforms (run after source adapters fetch)
#
# pipelines:
#   - name: combined
#     sources: [hackernews, reddit]
#     transforms:
#       - type: dedupe
#         strategy: url
#       - type: latest
#         count: 40

# Layout: recursive flexbox tree
# Each node is either a container (direction + children) or a panel (panel + source)
layout:
  direction: row
  children:
    - panel: hackernews
      flex: 2
      source: hackernews
      limit: 30

    - panel: rss
      flex: 1
      source: rss
      limit: 20

# --- Layout examples ---
