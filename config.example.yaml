adapters:
  - type: rss
    params:
      urls:
        - https://example.com/feed.xml
    refresh_interval: 30  # minutes, default 15

  - type: hackernews
    params:
      stories: top  # top, new, or best
      limit: 30

  # - type: github-releases
  #   params:
  #     repos:
  #       - oven-sh/bun
  #       - honojs/hono

  # - type: reddit
  #   params:
  #     subreddits:
  #       - programming
  #       - selfhosted
  #     sort: hot  # hot, new, or top
  #     limit: 25

layout:
  panels:
    - all      # combined feed
    - digest   # LLM digest

llm:
  provider: openai  # or anthropic, google, etc.
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}

  digest:
    max_length: 500
    style: brief  # brief or detailed
    focus_areas:
      - ai
      - programming

  interests:
    - artificial intelligence
    - typescript
    - open source
