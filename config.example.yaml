# Pipelines: merge items from multiple adapters, then transform
pipelines:
  - name: tech-feed
    sources: [hackernews, lobsters]
    transforms:
      - type: dedupe
        strategy: url
      - type: latest
        count: 40

# Layout: recursive flexbox tree
# Each node is either a container (direction + children) or a panel (panel + source)
layout:
  direction: row
  children:
    - panel: tech-feed
      source: tech-feed
      flex: 2
      limit: 40

    - direction: column
      flex: 1
      children:
        - panel: blogs
          source: rss
          limit: 15

        - panel: releases
          source: gh-releases
          limit: 10

    - direction: column
      flex: 1
      children:
        - panel: trending
          source: gh-trending
          limit: 15

        - panel: devto
          source: devto
          limit: 15

# --- Layout examples ---
#
# Single column (mobile-friendly):
#
# layout:
#   direction: column
#   children:
#     - panel: all
#       source: all
#       limit: 50
#
# Three equal columns:
#
# layout:
#   direction: row
#   children:
#     - panel: hackernews
#       source: hackernews
#     - panel: lobsters
#       source: lobsters
#     - panel: rss
#       source: rss

# --- Transform reference ---
# Transforms run at ingest time (on adapter or pipeline), not at render time.
#
# - type: latest          # keep N most recent items
#   count: 50
#
# - type: filter          # keep items matching keywords
#   keywords: [ai, rust]
#   fields: [title, body] # optional, default: [title, body]
#
# - type: exclude         # remove items matching keywords
#   keywords: [sponsored]
#   fields: [title, body]
#
# - type: sort            # sort items
#   field: timestamp      # timestamp, title, or source
#   direction: desc       # asc or desc
#
# - type: dedupe          # deduplicate items
#   strategy: url         # url, domain-normalized, or title-similarity
#   threshold: 0.85       # similarity threshold for title-similarity (0-1)
#   keep: highest-score   # highest-score, earliest, or latest
#
# - type: time-decay      # rank by engagement + recency
#   half_life: "12h"
#   engagement_weight: 0.7
#   recency_weight: 0.3
#   decay: exponential    # exponential or linear
#
# - type: keyword-score   # score/rank by keyword relevance
#   keywords:
#     - term: "rust"
#       weight: 10
#     - term: "AI|machine learning"
#       weight: 15
#       regex: true
#   min_score: 0
#
# - type: cluster         # group related items (no LLM)
#   strategy: auto        # domain, keywords, source, or auto
#
# - type: llm-summarize   # add LLM summaries to items
# - type: llm-filter      # keep items matching LLM criteria
#   criteria: "relevant to AI research"
# - type: llm-rank        # reorder by relevance to interests
# - type: llm-merge       # group/merge related items via LLM
#   prompt: "Group items about the same topic"

# LLM config (optional — LLM transforms gracefully degrade without it)
# llm:
#   provider: openai
#   model: gpt-4o-mini
#   api_key: ${OPENAI_API_KEY}
#   interests:
#     - systems programming
#     - web development
#     - open source
