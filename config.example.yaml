  #       interests: [distributed systems, compilers, security, open source]
  #     - type: latest
  #       count: 20
  #     - type: llm-summarize               # fetches full page text before summarizing
  #       fetch_content: true

# Layout: recursive flexbox tree
# Each node is either a container (direction + children) or a panel (panel + source)
layout:
  direction: row
  children:
    - panel: tech-feed
      source: tech-feed
      flex: 2
      limit: 40

    - direction: column
      flex: 1
      children:
        - panel: blogs
          source: rss
          limit: 15

        - panel: releases
          source: gh-releases
          limit: 10

    - direction: column
      flex: 1
      children:
        - panel: trending
          source: gh-trending
          limit: 15

        - panel: devto
          source: devto
          limit: 15

# --- Layout examples ---
#
# Single column (mobile-friendly):
#
# layout:
#   direction: column
#   children:
#     - panel: all
#       source: all
#       limit: 50
#
# Three equal columns:
#
# layout:
#   direction: row
#   children:
#     - panel: hackernews
#       source: hackernews
#     - panel: lobsters
#       source: lobsters
#     - panel: rss
#       source: rss
#
# Widget examples (embed static content in the layout without an adapter):
#
#     # Image widget - logo, banner, or chart image
#     - image: https://example.com/banner.png
#       alt: "Dashboard banner"
#       object_fit: cover
#       max_height: 120px
#       link: https://example.com
#
#     # Text widget - notes, instructions, or changelogs (format: plain | markdown | html)
#     - text: "## Welcome\nYour personalized dashboard."
#       format: markdown
#       title: "About"
#
#     # Iframe widget - embed an external page (Grafana, status page, etc.)
#     - iframe: https://grafana.example.com/d/abc
#       title: "Metrics"
#       height: 400px            # or use aspect_ratio: "16/9" (default when no height)
#
# Bookmarks adapter (curated links, no network fetch):
#
#   - type: bookmarks
#     params:
#       items:
#         - title: "Linear"
#           url: "https://linear.app"
#           description: "Project management"
#           tags: ["work"]
#         - title: "Figma"
#           url: "https://figma.com"
#           tags: ["design"]
#
# Counter adapter (JSON endpoint stat card):
#
#   - type: counter
#     params:
#       url: https://api.github.com/repos/oven-sh/bun
#       json_path: stargazers_count
#       label: "Bun Stars"
#       # unit: " stars"                        # suffix after the value
#       # compare_url: https://.../yesterday    # previous value for trend arrow
#       # compare_path: stargazers_count        # json_path in compare response (defaults to json_path)
#       # headers:                              # custom headers (supports ${ENV_VAR} interpolation)
#       #   Authorization: "Bearer ${GH_TOKEN}"
#   # Use display: counter on the panel:
#   # - panel: stars
#   #   source: counter
#   #   display: counter

# Optional server settings (both fields optional):
#
# server:
#   base_path: /pace     # serve under a URL prefix behind a reverse proxy (default: none)
#   retention_days: 30   # days to keep fetched items in SQLite; 0 disables pruning (default: 30)

# see skills/pace-config/SKILL.md for the full reference (adapters, transforms, pipelines, layout, LLM config and examples).
