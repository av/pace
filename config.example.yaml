# Layout: recursive flexbox tree
# Each node is either a container (direction + children) or a panel (panel + source + transforms)
layout:
  direction: row
  children:
    - panel: hackernews
      flex: 2
      source: hackernews
      transforms:
        - type: latest
          count: 30

    - panel: rss
      flex: 1
      source: rss
      transforms:
        - type: latest
          count: 20

