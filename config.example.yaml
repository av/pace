# pace config — adapters with ingest-time transforms + flexbox layout

adapters:
  - type: hackernews
    params:
      feed: top
      limit: 40
      min_score: 10
    refresh_interval: 10
    transforms:
      - type: exclude
        keywords: [hiring, "is hiring", "who is hiring"]
        fields: [title]
      - type: latest
        count: 30

  - type: lobsters
    params:
      feed: hottest
      limit: 25
      min_score: 3
    refresh_interval: 15
    transforms:
      - type: latest
        count: 20

  - type: rss
    params:
      urls:
        - https://simonwillison.net/atom/everything/
        - https://blog.pragmaticengineer.com/rss/
        - https://martinfowler.com/feed.atom
        - https://jvns.ca/atom.xml
    refresh_interval: 30
    transforms:
      - type: latest
        count: 15

  - name: gh-trending
    type: github
    params:
      mode: trending
      since: weekly
      limit: 15
    refresh_interval: 60

  - name: gh-releases
    type: github
    params:
      mode: releases
      repos:
        - oven-sh/bun
        - denoland/deno
        - golang/go
        - rust-lang/rust
      limit: 10
    refresh_interval: 60

  - type: devto
    params:
      tags: [webdev, devops, programming]
      top: 7
      limit: 15
    refresh_interval: 30
    transforms:
      - type: latest
        count: 15

