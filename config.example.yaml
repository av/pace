# --- Transform reference ---
#
# - type: latest          # take N most recent items
#   count: 50
#
# - type: filter          # keep items matching keywords
#   keywords: [ai, rust]
#   fields: [title, body] # optional, default: [title, body]
#
# - type: exclude         # remove items matching keywords
#   keywords: [sponsored]
#   fields: [title, body]
#
# - type: sort            # sort items
#   field: timestamp      # timestamp, title, or source
#   direction: desc       # asc or desc
#
# - type: dedupe          # deduplicate items across feeds
#   strategy: url         # url (exact match), domain-normalized (strips tracking params/www),
#                         # or title-similarity (fuzzy Levenshtein matching)
#   threshold: 0.85       # similarity threshold for title-similarity (0-1, default 0.85)
#   keep: highest-score   # which duplicate to keep: highest-score, earliest, or latest
#   log: true             # log which items were deduped (default: true)
#
# - type: time-decay      # rank items by engagement + recency ("hot" ranking)
#   half_life: "12h"       # how quickly items lose relevance (e.g. "6h", "12h", "24h", "3d", "1w")
#   engagement_weight: 0.7 # weight for engagement score (points/stars/boosts/etc.)
#   recency_weight: 0.3    # weight for recency score (must sum to 1 with engagement_weight)
#   decay: exponential     # decay function: exponential (HN-style) or linear
#   annotate: false        # append computed hot-score breakdown to item body
#   min_score: 0           # optional: drop items below this final hot-score
#
# - type: keyword-score   # score/rank items by keyword relevance
#   keywords:
#     - term: "rust"          # literal match (case-insensitive)
#       weight: 10
#     - term: "typescript"
#       weight: 8
#     - term: "blockchain|crypto|nft"   # regex pattern
#       weight: -20
#       regex: true
#     - term: "AI|machine learning|LLM"
#       weight: 15
#       regex: true
#   min_score: 0             # optional: drop items scoring below this (default: keep all)
#   annotate: true           # optional: append matched keywords and score to body (default: false)
#
# - type: cluster         # group related items into topic clusters (no LLM)
#   strategy: auto        # domain (group by URL domain), keywords (title/body keyword overlap),
#                         # source (group by feed source), auto (weighted combination of all signals)
#   min_cluster_size: 2   # minimum items needed to form a cluster (default: 2)
#   max_clusters: 10      # maximum number of clusters to keep (default: 10)
#   similarity_threshold: 0.3  # minimum similarity score to link items (0-1, default: 0.3)
#   annotate: true        # prepend cluster label to item body, e.g. "[GitHub] ..." (default: true)
#
# - type: llm-summarize   # add LLM summaries to items
#
# - type: llm-filter      # keep only items matching LLM criteria
#   criteria: "relevant to AI research"
#
# - type: llm-rank        # reorder by relevance to interests
#   interests: [ai, typescript]  # optional, falls back to llm.interests
#
# - type: llm-merge       # group/merge related items via LLM
#   prompt: "Group items about the same topic"

# LLM config (optional — LLM transforms gracefully degrade without it)
# llm:
#   provider: openai
#   model: gpt-4o-mini
#   api_key: ${OPENAI_API_KEY}
#   interests:
#     - artificial intelligence
#     - typescript
#     - open source
