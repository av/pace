# Pipelines: merge items from multiple adapters, then transform
pipelines:
  - name: tech-feed
    sources: [hackernews, lobsters]
    transforms:
      # Two-pass dedupe: domain-normalized then title-similarity.
      - type: dedupe
        strategy: domain-normalized
        keep: highest-score
      - type: dedupe
        strategy: title-similarity
        threshold: 0.8
        keep: highest-score
      # Blend engagement with recency - surface what's trending now.
      - type: time-decay
        half_life: 8h
        engagement_weight: 0.7
        recency_weight: 0.3
        decay: exponential
      # Group related stories across sources.
      - type: cluster
        strategy: auto
        min_cluster_size: 2
        max_clusters: 8
        similarity_threshold: 0.3
      - type: latest
        count: 40

  # --- Cross-source dedupe + interest ranking example (uncomment and add llm config to enable) ---
