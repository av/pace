# pace config — adapters with ingest-time transforms + flexbox layout

adapters:
  - type: hackernews
    params:
      feed: top            # top, new, best, ask, show, job (aliases: front, newest, askhn, showhn, jobs)
      limit: 30            # max items to return (up to 200)
      min_score: 0         # filter: only include items with this many points or more
    refresh_interval: 15
    transforms:
      - type: latest
        count: 30

  - type: rss
    params:
      urls:
        - https://feeds.arstechnica.com/arstechnica/index
    refresh_interval: 30
    transforms:
      - type: latest
        count: 20

