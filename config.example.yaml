# Pipelines: merge items from multiple adapters, then transform
pipelines:
  - name: tech-feed
    sources: [hackernews, lobsters]
    transforms:
      - type: dedupe
        strategy: url
      - type: latest
        count: 40

# Layout: recursive flexbox tree
# Each node is either a container (direction + children) or a panel (panel + source)
layout:
  direction: row
  children:
    - panel: tech-feed
      source: tech-feed
      flex: 2
      limit: 40

    - direction: column
      flex: 1
      children:
        - panel: blogs
          source: rss
          limit: 15

        - panel: releases
          source: gh-releases
          limit: 10

    - direction: column
      flex: 1
      children:
        - panel: trending
          source: gh-trending
          limit: 15

        - panel: devto
          source: devto
          limit: 15

# --- Layout examples ---
