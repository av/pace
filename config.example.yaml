# pace config — flexbox layout + source + transforms

adapters:
  - type: hackernews
    params:
      stories: top
      limit: 30
    refresh_interval: 15

  - type: rss
    params:
      urls:
        - https://example.com/feed.xml
    refresh_interval: 30

  # - type: reddit
  #   params:
  #     subreddits:
  #       - programming
  #       - selfhosted
  #     sort: hot
  #     limit: 25

  # - type: github-releases
  #   params:
  #     repos:
  #       - oven-sh/bun
  #       - honojs/hono

  # - type: youtube
  #   params:
  #     channels:
  #       - UCXuqSBlHAE6Xw-yeJA0Tunw  # Linus Tech Tips
  #       - UCsBjURrPoezykLs9EqgamOA  # Fireship
  #     playlists: []  # optional: YouTube playlist IDs
  #     limit: 15
  #   refresh_interval: 30

# Layout: recursive flexbox tree
# Each node is either a container (direction + children) or a panel (panel + source + transforms)
layout:
  direction: row
  children:
    - panel: hackernews
      flex: 2
      source: hackernews
      transforms:
        - type: latest
          count: 30

    - panel: rss
      flex: 1
      source: rss
      transforms:
        - type: latest
          count: 20

