# Academic paper tracker across any field.
# Replace categories and query with your research interests.
# See https://arxiv.org/category_taxonomy for all ArXiv categories.

adapters:
  - name: arxiv-categories
    type: arxiv
    params:
      categories: ["cs.AI", "cs.PL", "cs.SE"]
      limit: 25
    refresh_interval: 300
    transforms:
      - type: dedupe
        strategy: title-similarity
        threshold: 0.8
      - type: sort
        field: timestamp
        direction: desc
      - type: latest
        count: 30

  - name: arxiv-search
    type: arxiv
    params:
      query: "formal verification OR program synthesis"
      limit: 15
    refresh_interval: 300
    transforms:
      - type: dedupe
        strategy: title-similarity
        threshold: 0.8
      - type: latest
        count: 15

  - type: stackexchange
    params:
      site: cstheory
      sort: votes
      min_score: 3
      limit: 10
    refresh_interval: 120
    transforms:
      - type: latest
        count: 10

  - type: hackernews
    params:
      feed: top
      limit: 50
    refresh_interval: 15

  - type: reddit
    params:
      subreddits:
        - compsci
        - AskAcademia
      sort: hot
      limit: 15
    refresh_interval: 30

pipelines:
  - name: discussion
    sources: [hackernews, reddit]
    transforms:
      - type: filter
        keywords: [paper, research, study, proof, theorem, published, arxiv, preprint, peer review, survey, journal]
        fields: [title]
      - type: dedupe
        strategy: domain-normalized
      - type: latest
        count: 15

layout:
  direction: row
  children:
    - direction: column
      flex: 2
      children:
        - panel: papers-categories
          flex: 1
          source: arxiv-categories
          limit: 30

        - panel: papers-search
          flex: 1
          source: arxiv-search
          limit: 15

    - direction: column
      flex: 1
      children:
        - panel: discussion
          flex: 1
          source: discussion
          limit: 15

        - panel: questions
          flex: 1
          source: stackexchange
          limit: 10
