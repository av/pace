# New product launches, demos, and side projects.
# Product Hunt + Show HN + builder communities + a discovery column of trending repos.
# Note: no reddit adapter here — Reddit blocks unauthenticated API access upstream.

adapters:
  - type: producthunt
    params:
      limit: 20
      enrich: true
      min_upvotes: 30
    refresh_interval: 300
    transforms:
      # Blend engagement with recency — surface what's trending now.
      - type: time-decay
        half_life: "6h"
        engagement_weight: 0.6
        recency_weight: 0.4
        decay: exponential
      - type: latest
        count: 15

  - type: hackernews
    params:
      feed: show
      limit: 30
      min_score: 2
    refresh_interval: 15
    transforms:
      # Blend engagement with recency — surface what's trending now.
      - type: time-decay
        half_life: "12h"
        engagement_weight: 0.7
        recency_weight: 0.3
        decay: exponential
      - type: latest
        count: 15

  - type: devto
    params:
      tags: ["showdev"]
      top: 7
      min_reactions: 10
      limit: 15
    refresh_interval: 60

  - type: lobsters
    params:
      feed: hottest
      tags: [show]
      limit: 10
    refresh_interval: 30

  - name: gh-trending
    type: github
    params:
      mode: trending
      since: daily
      limit: 15
    refresh_interval: 180
    transforms:
      # Blend engagement with recency — surface what's trending now.
      - type: time-decay
        half_life: "24h"
        engagement_weight: 0.8
        recency_weight: 0.2
        decay: exponential
      - type: latest
        count: 15

  # Brand-new packages shipping to the npm registry — early signal for new tools.
  - name: npm-fresh
    type: npm
    params:
      keywords: [cli, framework]
      sort: optimal
      limit: 10
    refresh_interval: 360

pipelines:
  - name: community
    sources: [devto, lobsters]
    transforms:
      # Fuzzy title matching to catch cross-source duplicates.
      - type: dedupe
        strategy: title-similarity
        threshold: 0.65
        keep: highest-score
      - type: keyword-score
        keywords:
          - term: "launch|launched|ship|shipped|built|made|created|introducing"
            weight: 10
            regex: true
          - term: "Show|demo|prototype|beta|alpha|mvp"
            weight: 8
            regex: true
          - term: "hiring|job|career|salary"
            weight: -20
            regex: true
        annotate: false
      # Blend engagement with recency — surface what's trending now.
      - type: time-decay
        half_life: "12h"
        engagement_weight: 0.6
        recency_weight: 0.4
        decay: exponential
      # Group related stories across sources.
      - type: cluster
        strategy: keywords
        min_cluster_size: 2
        max_clusters: 5
        similarity_threshold: 0.35
      - type: latest
        count: 15

layout:
  direction: row
  children:
    - panel: product-hunt
      flex: 1
      source: producthunt
      limit: 15

    - panel: show-hn
      flex: 1
      source: hackernews
      limit: 15

    - direction: column
      flex: 1
      children:
        - panel: community
          flex: 1
          source: community
          limit: 15

        - panel: trending-today
          flex: 1
          source: gh-trending
          limit: 15

        - panel: fresh-on-npm
          flex: 1
          source: npm-fresh
          limit: 10
