# AI and machine learning: fresh papers, local-LLM community, releases, and curated blogs.
# Note: r/MachineLearning and r/LocalLLaMA are gone from this preset — Reddit blocks
# unauthenticated API access. Lemmy's localllama community covers the same ground.

adapters:
  - type: hackernews
    params:
      feed: top
      limit: 50
    refresh_interval: 10
    transforms:
      - type: filter
        keywords: [ai, llm, gpt, claude, gemini, model, openai, anthropic, neural, transformer, diffusion, machine learning, deep learning, agent, rag, fine-tun, inference]
        fields: [title]
      - type: exclude
        keywords: [hiring]
        fields: [title]
      # Blend engagement with recency — surface what's trending now.
      - type: time-decay
        half_life: 8h
        engagement_weight: 0.6
        recency_weight: 0.4
        decay: exponential
      - type: latest
        count: 50

  - name: papers
    type: arxiv
    params:
      categories: [cs.AI, cs.LG, cs.CL]
      limit: 30
    refresh_interval: 180
    transforms:
      - type: dedupe
        strategy: title-similarity
        threshold: 0.8
      # Score by topic relevance — weighted keyword matching.
      - type: keyword-score
        keywords:
          - term: "language.model|LLM|transformer|GPT|attention"
            weight: 8
            regex: true
          - term: "RLHF|DPO|alignment|safety|reward.model"
            weight: 7
            regex: true
          - term: "fine.tun|LoRA|adapter|instruction.tun"
            weight: 7
            regex: true
          - term: "retrieval|RAG|augmented.generation"
            weight: 6
            regex: true
          - term: "benchmark|evaluation|leaderboard"
            weight: 5
            regex: true
          - term: "diffusion|image.generation|video.generation|multimodal"
            weight: 4
            regex: true
        annotate: false
      - type: latest
        count: 20

  - name: blogs
    type: rss
    params:
      urls:
        - https://lilianweng.github.io/index.xml
        - https://simonwillison.net/atom/everything/
        - https://www.interconnects.ai/feed
        - https://huggingface.co/blog/feed.xml
    refresh_interval: 30
    transforms:
      - type: latest
        count: 15

  - name: localllama
    type: lemmy
    params:
      instance: sh.itjust.works
      communities: [localllama]
      sort: hot
      limit: 25
    refresh_interval: 20
    transforms:
      # Blend engagement with recency — favor active discussions.
      - type: time-decay
        half_life: 12h
        engagement_weight: 0.7
        recency_weight: 0.3
        decay: exponential
      - type: latest
        count: 15

  - type: github-releases
    params:
      repos:
        - huggingface/transformers
        - vllm-project/vllm
        - ggml-org/llama.cpp
        - ollama/ollama
        - pytorch/pytorch
        - anthropics/anthropic-sdk-python
    transforms:
      - type: latest
        count: 15

# High-signal cross-source strip: open models, benchmarks, and inference news only.
pipelines:
  - name: firehose
    sources: [hackernews, localllama, blogs]
    transforms:
      # Collapse cross-posts across sources — keep highest scored.
      - type: dedupe
        strategy: domain-normalized
        keep: highest-score
      # Score by topic relevance — weighted keyword matching.
      - type: keyword-score
        keywords:
          - term: "benchmark|sota|state.of.the.art|eval|leaderboard"
            weight: 10
            regex: true
          - term: "open.source|open.weights|weights|released|releasing"
            weight: 8
            regex: true
          - term: "fine.tun|finetun|LoRA|QLoRA|RLHF|DPO"
            weight: 8
            regex: true
          - term: "context.window|inference|quantiz|distill|speculative"
            weight: 6
            regex: true
          - term: "vram|throughput|tokens?.per.sec|latency"
            weight: 5
            regex: true
        min_score: 5
        annotate: false
      - type: sort
        field: timestamp
        direction: desc
      - type: latest
        count: 10

  # Group related stories across sources.
  - name: cross-talk
    sources: [hackernews, localllama, blogs, papers]
    transforms:
      - type: dedupe
        strategy: title-similarity
        threshold: 0.75
        keep: highest-score
      # Cluster multi-source stories by shared keywords.
      - type: cluster
        strategy: keywords
        min_cluster_size: 2
        max_clusters: 5
        similarity_threshold: 0.25
        annotate: true
      - type: latest
        count: 15

layout:
  direction: column
  children:
    - direction: row
      flex: 3
      children:
        - panel: papers
          flex: 1
          source: papers
          limit: 20

        - direction: column
          flex: 1
          children:
            - panel: hacker-news-ai
              flex: 1
              source: hackernews
              limit: 50

            - panel: local-llama
              flex: 1
              source: localllama
              limit: 15

        - direction: column
          flex: 1
          children:
            - panel: blogs
              flex: 1
              source: blogs
              limit: 15

            - panel: releases
              flex: 1
              source: github-releases
              limit: 15

    - direction: row
      flex: 1
      children:
        - panel: firehose
          flex: 1
          source: firehose
          limit: 10

        - panel: cross-talk
          flex: 1
          source: cross-talk
          limit: 15

